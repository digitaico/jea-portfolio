{% extends "base.html" %}

{% block content %}
<section class="hero">
  <div class="hero__mark" aria-hidden="true">
    <svg width="64" height="70" viewBox="0 0 120 132" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="18" y="10" width="84" height="104" rx="12" fill="#ffffff" stroke="#d7e2ea" stroke-width="2"/>
      <rect x="34" y="30" width="40" height="6" rx="3" fill="#0e2a3b"/>
      <rect x="34" y="44" width="52" height="5" rx="2.5" fill="#9fb0bd"/>
      <rect x="34" y="55" width="46" height="5" rx="2.5" fill="#9fb0bd"/>
      <path d="M30 92 h13 l5 -13 l8 26 l6 -13 h20" stroke="#0fa79e" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="8" y="66" width="104" height="7" rx="3.5" fill="#0fa79e" opacity="0.16"/>
      <rect x="8" y="68.5" width="104" height="2.5" rx="1.25" fill="#0fa79e"/>
    </svg>
  </div>
  <h1 class="hero__title">{{ title }}</h1>
  <p class="hero__subtitle">
    Sube una imagen de la orden o tómale una foto para digitalizarla.
  </p>
</section>

<form class="card" action="/images" method="post" enctype="multipart/form-data">
  <input id="file-input" class="visually-hidden" type="file" name="files"
         accept="image/*" capture="environment" multiple hidden />

  <upload-dropzone for="file-input"></upload-dropzone>

  <div class="card__or"><span>o</span></div>

  <camera-capture for="file-input"></camera-capture>

  <div id="preview" class="preview" aria-live="polite"></div>

  <div class="card__actions">
    <button type="submit" class="btn btn--primary btn--block">Subir orden</button>
    <p class="card__hint">Máx. {{ max_upload_mb }} MB por archivo</p>
  </div>
</form>

<ul class="caps">
  <li class="caps__item">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M14 3v5h5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M14 3H6v18h12V8l-4-5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <span>JPG · PNG · HEIC · PDF</span>
  </li>
  <li class="caps__item">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3 8h4l2-3h6l2 3h4v12H3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="12" cy="13" r="3.5" stroke="currentColor" stroke-width="2"/>
    </svg>
    <span>Foto del celular</span>
  </li>
  <li class="caps__item">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M5 12l4 4 10-10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <!--<span>Varias a la vez</span>-->
  </li>
</ul>
{% endblock %}
