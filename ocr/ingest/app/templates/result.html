{% extends "base.html" %}

{% block content %}
<section class="result">
  <h2 class="result__heading">Received {{ received | length }} file(s)</h2>
  <ul class="result__list">
    {% for item in received %}
    <li class="result__item">
      <span class="result__name">{{ item.filename }}</span>
      <span class="result__meta">{{ item.content_type }}</span>
      <span class="result__meta">{{ "%.1f"|format(item.size_bytes / 1024) }} KB</span>
    </li>
    {% endfor %}
  </ul>
  <a class="btn" href="/">Upload more</a>
</section>
{% endblock %}
